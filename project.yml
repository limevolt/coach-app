# Projet Xcode généré par XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Ne modifie pas Coach.xcodeproj à la main : il est régénéré automatiquement
# par la compilation GitHub à chaque mise à jour de la branche main.

name: Coach
options:
  bundleIdPrefix: com.limevolt
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Équipe de signature (compte Apple du propriétaire).
    DEVELOPMENT_TEAM: FD598HBBW4
    CODE_SIGN_STYLE: Automatic
    # Réglages recommandés par Xcode 26
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  Coach:
    type: application
    platform: iOS
    sources:
      - path: Coach
      - path: Shared
    dependencies:
      - target: CoachWatch
    info:
      path: Coach/Info.plist
      properties:
        CFBundleDisplayName: Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSHealthShareUsageDescription: Coach lit tes entraînements, ta fréquence cardiaque et ta VFC pour préparer ton suivi.
        NSHealthUpdateUsageDescription: Coach enregistre tes séances dans Santé.
        LSSupportsOpeningDocumentsInPlace: false
        # « Mon propre coach » : joindre un serveur personnel (Ollama sur le Mac, en http)
        NSLocalNetworkUsageDescription: Coach se connecte à ton propre coach (par exemple Ollama sur ton Mac) sur ton réseau.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Plan Coach
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
    entitlements:
      path: Coach/Coach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limevolt.coach
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - CoachTests

  CoachWatch:
    type: application
    platform: watchOS
    sources:
      - path: CoachWatch
      - path: Shared
    info:
      path: CoachWatch/Info.plist
      properties:
        CFBundleDisplayName: Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.limevolt.coach
        NSHealthShareUsageDescription: Coach lit ta fréquence cardiaque et tes calories pendant la séance.
        NSHealthUpdateUsageDescription: Coach enregistre tes séances (durée, calories, fréquence cardiaque) dans Santé.
        WKBackgroundModes:
          - workout-processing
    entitlements:
      path: CoachWatch/CoachWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limevolt.coach.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  # Tests unitaires (logique sans écran) : lancés par la compilation GitHub à chaque push.
  CoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoachTests
    dependencies:
      - target: Coach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limevolt.coach.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Coach.app/Coach
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1"

  # Captures automatiques (tests d'interface) : voir DESIGN.md et .github/workflows/captures.yml.
  # Schémas séparés : « Coach » et « CoachWatch » ne changent pas.
  CoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CoachUITests
      - path: CapturesSupport
      - path: docs/exemple-plan.json
        buildPhase: resources
    dependencies:
      - target: Coach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limevolt.coach.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Coach
        TARGETED_DEVICE_FAMILY: "1"

  CoachWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: CoachWatchUITests
      - path: CapturesSupport
      - path: docs/exemple-plan.json
        buildPhase: resources
    dependencies:
      - target: CoachWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limevolt.coach.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CoachWatch
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  CoachCaptures:
    build:
      targets:
        Coach: all
        CoachUITests: [test]
    test:
      targets:
        - CoachUITests
  CoachWatchCaptures:
    build:
      targets:
        CoachWatch: all
        CoachWatchUITests: [test]
    test:
      targets:
        - CoachWatchUITests
